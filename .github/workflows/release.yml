name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - run: node --test internal/auth/web/session.test.mjs
      - name: Build Windows binaries
        shell: pwsh
        run: |
          $env:CGO_ENABLED = '0'
          foreach ($arch in @('amd64', 'arm64')) {
            $env:GOARCH = $arch
            go build -trimpath -ldflags "-s -w -X main.version=$env:GITHUB_REF_NAME" -o "dist/tripo-mcp-windows-$arch.exe" .
            if ($LASTEXITCODE -ne 0) { throw "Build failed: $arch" }
          }
          Get-ChildItem dist/*.exe | Sort-Object Name | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content dist/SHA256SUMS.txt -Encoding ascii
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME dist/tripo-mcp-windows-amd64.exe dist/tripo-mcp-windows-arm64.exe dist/SHA256SUMS.txt --verify-tag --title "Tripo-MCP $env:GITHUB_REF_NAME" --generate-notes

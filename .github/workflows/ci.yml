name: tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./...
        env:
          CGO_ENABLED: '1'
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - run: node --test internal/auth/web/session.test.mjs internal/auth/web/app.test.mjs
      - name: Build Windows architectures
        shell: pwsh
        run: |
          $env:CGO_ENABLED = '0'
          foreach ($arch in @('amd64', 'arm64')) {
            $env:GOARCH = $arch
            go build -trimpath -o "dist/tripo-mcp-windows-$arch.exe" .
            if ($LASTEXITCODE -ne 0) { throw "Build failed: $arch" }
          }
